name: Question
description: Ask about setup, supported behavior, or interpreting results.
title: "[Question]: "
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you are trying to do and what is unclear.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What have you tried?
      description: Include documentation consulted and relevant environment details. Remove secrets and private data.

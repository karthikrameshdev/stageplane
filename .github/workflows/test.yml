name: tests
on: [push, pull_request]
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --python 3.13 --extra test --locked
      - run: uv run --locked --extra test pytest -q
      - run: uv run --locked python -m scripts.scale_validation --output /tmp/stageplane-scale.json
      - run: node --check stageplane/ui/app.js
      - run: docker compose config --quiet
        env:
          STAGEPLANE_TOKEN: ci-configuration-only

$kind: http-example
request:
  url: "{{baseUrl}}/api/nodes/:node_id/drain"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: node_id
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 4000

$kind: http-example
request:
  url: "{{baseUrl}}/api/jobs/:job_id"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: job_id
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000

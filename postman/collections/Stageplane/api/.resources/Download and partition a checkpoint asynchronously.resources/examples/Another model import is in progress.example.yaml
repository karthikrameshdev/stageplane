$kind: http-example
request:
  url: "{{baseUrl}}/api/models/import"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "source": "string",
        "revision": "main",
        "layers_per_chunk": 2
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 3000

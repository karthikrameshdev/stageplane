$kind: http-request
name: metrics
order: 6000
method: GET
url: "{{baseUrl}}/metrics"
headers:
  - key: Authorization
    value: "Bearer {{bearerToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Prometheus exposition", () => { pm.expect(pm.response.headers.get("Content-Type")).to.include("text/plain"); pm.expect(pm.response.text()).to.include("# TYPE stageplane_requests_total counter"); pm.expect(pm.response.text()).to.match(/stageplane_build_info\{version="[^"]+"\} 1/); });

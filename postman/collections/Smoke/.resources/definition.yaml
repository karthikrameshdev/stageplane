$kind: collection
name: Stageplane smoke
variables:
  - key: baseUrl
    value: http://127.0.0.1:8080
  - key: bearerToken
    value: ""
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |
      if (pm.info.requestName !== "metrics" && pm.info.requestName !== "readiness") {
        pm.test("HTTP 200", () => pm.response.to.have.status(200));
        pm.test("JSON response", () => pm.expect(pm.response.json()).to.be.an("object"));
      }
      pm.test("Request ID echoed", () => pm.expect(pm.response.headers.get("X-Request-ID")).to.match(/^[A-Za-z0-9._:-]{1,128}$/));
